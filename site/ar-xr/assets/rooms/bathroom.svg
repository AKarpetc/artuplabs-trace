<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ee"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd9e4"/><stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d99a6"/><stop offset=".5" stop-color="#e3e8ee"/><stop offset="1" stop-color="#7d8996"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="256" cy="392" rx="210" ry="26" fill="url(#shadow)"/>
  <!-- floor faucet -->
  <rect x="404" y="150" width="14" height="236" rx="7" fill="url(#metal)"/>
  <path d="M411 156 q0 -34 -40 -34 h-22" fill="none" stroke="url(#metal)" stroke-width="14" stroke-linecap="round"/>
  <rect x="396" y="378" width="30" height="10" rx="5" fill="#7d8996"/>
  <!-- tub body -->
  <path d="M70 206 h372 c10 0 16 8 14 18 l-26 120 c-6 26 -26 40 -52 40 h-244 c-26 0 -46 -14 -52 -40 l-26 -120 c-2 -10 4 -18 14 -18 z" fill="url(#tub)" stroke="#c5ced9" stroke-width="2"/>
  <!-- rim -->
  <rect x="58" y="192" width="396" height="26" rx="13" fill="#ffffff" stroke="#c5ced9" stroke-width="2"/>
  <!-- inner basin -->
  <path d="M84 205 h344 c4 0 6 3 5 6 l-4 10 h-346 l-4 -10 c-1 -3 1 -6 5 -6 z" fill="url(#inner)"/>
  <!-- water hint -->
  <path d="M96 208 h320" stroke="#9fc4e6" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- feet -->
  <path d="M120 380 l-14 22 h28 z" fill="#b9c3ce"/>
  <path d="M392 380 l14 22 h-28 z" fill="#b9c3ce"/>
  <!-- highlight -->
  <path d="M96 240 c6 50 18 90 40 112" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".8"/>
</svg>
