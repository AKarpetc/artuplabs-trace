modules:
  jira:globalPage:
    - key: reports-global-page
      resource: global-page
      resolver:
        function: resolver
      title:
        i18n: module.globalPage.title
      icon: resource:icons;icon.svg
      layout: basic
  jira:issueNavigatorAction:
    - key: reports-navigator-action
      resource: action
      viewportSize: large
      resolver:
        function: resolver
      title:
        i18n: module.issueNavigatorAction.title
  jira:boardAction:
    - key: reports-board-action
      resource: action
      viewportSize: large
      resolver:
        function: resolver
      title:
        i18n: module.boardAction.title
  jira:backlogAction:
    - key: reports-backlog-action
      resource: action
      viewportSize: large
      resolver:
        function: resolver
      title:
        i18n: module.backlogAction.title
  jira:sprintAction:
    - key: reports-sprint-action
      resource: action
      viewportSize: large
      resolver:
        function: resolver
      title:
        i18n: module.sprintAction.title
  jira:issueAction:
    - key: reports-issue-action
      resource: action
      viewportSize: large
      resolver:
        function: resolver
      title:
        i18n: module.issueAction.title
  function:
    - key: resolver
      handler: index.resolverHandler
resources:
  - key: global-page
    path: static/app/dist/global-page
  - key: action
    path: static/app/dist/action
  - key: icons
    path: resources
translations:
  resources:
    - key: zh-CN
      path: locales/zh-CN.json
    - key: zh-TW
      path: locales/zh-TW.json
    - key: cs-CZ
      path: locales/cs-CZ.json
    - key: da-DK
      path: locales/da-DK.json
    - key: nl-NL
      path: locales/nl-NL.json
    - key: en-US
      path: locales/en-US.json
    - key: en-GB
      path: locales/en-GB.json
    - key: et-EE
      path: locales/et-EE.json
    - key: fi-FI
      path: locales/fi-FI.json
    - key: fr-FR
      path: locales/fr-FR.json
    - key: de-DE
      path: locales/de-DE.json
    - key: hu-HU
      path: locales/hu-HU.json
    - key: is-IS
      path: locales/is-IS.json
    - key: it-IT
      path: locales/it-IT.json
    - key: ja-JP
      path: locales/ja-JP.json
    - key: ko-KR
      path: locales/ko-KR.json
    - key: no-NO
      path: locales/no-NO.json
    - key: pl-PL
      path: locales/pl-PL.json
    - key: pt-BR
      path: locales/pt-BR.json
    - key: pt-PT
