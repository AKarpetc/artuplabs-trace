permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - read:board-scope.admin:jira-software
    - read:project:jira
    - storage:app
  content:
    styles:
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/a6576b04-b09c-43a8-8b22-bd83557c112d
  licensing:
    enabled: true
