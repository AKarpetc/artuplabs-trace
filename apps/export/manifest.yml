modules:
  confluence:spacePage:
    - key: export-space-page
      resource: space-page
      resolver:
        function: resolver
      title:
        i18n: module.spacePage.title
      route: artup-export
      icon: resource:icons;icon.svg
  confluence:contentAction:
    - key: export-content-action
      resource: content-action
      resolver:
        function: resolver
      title:
        i18n: module.contentAction.title
      viewportSize: large
  function:
    - key: resolver
      handler: index.resolverHandler
resources:
  - key: space-page
    path: static/app/dist/space-page
  - key: content-action
    path: static/app/dist/content-action
  - key: icons
    path: resources
translations:
  resources:
    - key: zh-CN
      path: locales/zh-CN.json
    - key: zh-TW
      path: locales/zh-TW.json
    - key: cs-CZ
      path: locales/cs-CZ.json
    - key: da-DK
      path: locales/da-DK.json
    - key: nl-NL
      path: locales/nl-NL.json
    - key: en-US
      path: locales/en-US.json
    - key: en-GB
      path: locales/en-GB.json
    - key: et-EE
      path: locales/et-EE.json
    - key: fi-FI
      path: locales/fi-FI.json
    - key: fr-FR
      path: locales/fr-FR.json
    - key: de-DE
      path: locales/de-DE.json
    - key: hu-HU
      path: locales/hu-HU.json
    - key: is-IS
      path: locales/is-IS.json
    - key: it-IT
      path: locales/it-IT.json
    - key: ja-JP
      path: locales/ja-JP.json
    - key: ko-KR
      path: locales/ko-KR.json
    - key: no-NO
      path: locales/no-NO.json
    - key: pl-PL
      path: locales/pl-PL.json
    - key: pt-BR
      path: locales/pt-BR.json
    - key: pt-PT
      path: locales/pt-PT.json
    - key: ro-RO
      path: locales/ro-RO.json
    - key: ru-RU
      path: locales/ru-RU.json
    - key: sk-SK
      path: locales/sk-SK.json
    - key: tr-TR
      path: locales/tr-TR.json
    - key: es-ES
      path: locales/es-ES.json
    - key: sv-SE
      path: locales/sv-SE.json
  fallback:
    default: en-US
permissions:
  scopes:
    - read:page:confluence
    - read:space:confluence
    - read:attachment:confluence
    - read:label:confluence
    - read:hierarchical-content:confluence
    - read:confluence-user
    - search:confluence
    - storage:app
  content:
    styles:
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/f4dc7e93-1ead-4561-a4f0-c4d15dabc40d
  licensing:
    enabled: true
