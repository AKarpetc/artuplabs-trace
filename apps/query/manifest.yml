modules:
  jira:globalPage:
    - key: query-global-page
      resource: global-page
      resolver:
        function: resolver
      title:
        i18n: module.globalPage.title
      icon: resource:icons;icon.svg
      layout: basic
  jira:adminPage:
    - key: query-admin-page
      resource: admin-page
      resolver:
        function: resolver
      title:
        i18n: module.adminPage.title
  jira:jqlFunction:
    - key: subtasks-of
      name: subtasksOf
      arguments:
        - name: subquery
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-sub-of
    - key: parents-of
      name: parentsOf
      arguments:
        - name: subquery
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-par-of
    - key: epics-of
      name: epicsOf
      arguments:
        - name: subquery
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-epi-of
    - key: issues-in-epics
      name: issuesInEpics
      arguments:
        - name: subquery
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-iss-in-epi
    - key: child-issues-of
      name: childIssuesOf
      arguments:
        - name: subquery
          required: true
        - name: depth
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-chi-iss-of
    - key: linked-issues-of
      name: linkedIssuesOf
      arguments:
        - name: subquery
          required: true
        - name: linkType
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-lin-iss-of
    - key: linked-issues-of-recursive
      name: linkedIssuesOfRecursive
      arguments:
        - name: subquery
          required: true
        - name: linkType
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-lin-iss-of-rec
    - key: linked-issues-of-recursive-limited
      name: linkedIssuesOfRecursiveLimited
      arguments:
        - name: subquery
          required: true
        - name: depth
          required: true
        - name: linkType
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-lin-iss-of-rec-lim
    - key: has-links
      name: hasLinks
      arguments:
        - name: linkType
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-has-lin
    - key: has-link-type
      name: hasLinkType
      arguments:
        - name: linkType
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-has-lin-typ
    - key: has-subtasks
      name: hasSubtasks
      arguments:
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-has-sub
    - key: previous-sprint
      name: previousSprint
      arguments:
        - name: board
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-pre-spr
    - key: next-sprint
      name: nextSprint
      arguments:
        - name: board
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-nex-spr
    - key: added-after-sprint-start
      name: addedAfterSprintStart
      arguments:
        - name: board
          required: true
        - name: sprint
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-add-aft-spr-sta
    - key: removed-after-sprint-start
      name: removedAfterSprintStart
      arguments:
        - name: board
          required: true
        - name: sprint
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-rem-aft-spr-sta
    - key: incomplete-in-sprint
      name: incompleteInSprint
      arguments:
        - name: board
          required: true
        - name: sprint
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-inc-in-spr
    - key: complete-in-sprint
      name: completeInSprint
      arguments:
        - name: board
          required: true
        - name: sprint
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-com-in-spr
    - key: commented
      name: commented
      arguments:
        - name: clauses
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-com
    - key: last-comment
      name: lastComment
      arguments:
        - name: clauses
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-las-com
    - key: has-comments
      name: hasComments
      arguments:
        - name: count
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-has-com
    - key: file-attached
      name: fileAttached
      arguments:
        - name: clauses
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-fil-att
    - key: has-attachments
      name: hasAttachments
      arguments:
        - name: extension
          required: false
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-has-att
    - key: date-compare
      name: dateCompare
      arguments:
        - name: subquery
          required: true
        - name: expression
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-dat-com
    - key: expression
      name: expression
      arguments:
        - name: subquery
          required: true
        - name: expression
          required: true
        - name: page
          required: false
      types:
        - issue
      operators:
        - in
        - not in
      function: fn-exp
  trigger:
    - key: query-events
      function: on-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
        - avi:jira-software:created:sprint
        - avi:jira-software:started:sprint
        - avi:jira-software:closed:sprint
        - avi:jira-software:updated:sprint
        - avi:jira-software:deleted:sprint
        - avi:jira:commented:issue
        - avi:jira:deleted:comment
        - avi:jira:created:attachment
        - avi:jira:deleted:attachment
      filter:
        ignoreSelf: true
    - key: query-lifecycle
      function: on-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  consumer:
    - key: query-refresh-consumer
      queue: query-refresh
      function: on-refresh
    - key: query-backfill-consumer
      queue: query-backfill
      function: on-backfill
  sql:
    - key: main
      engine: mysql
  scheduledTrigger:
    - key: query-reconcile
      function: on-reconcile
      interval: hour
  function:
    - key: resolver
      handler: index.resolverHandler
    - key: fn-sub-of
      handler: index.subtasksOf
    - key: fn-par-of
      handler: index.parentsOf
    - key: fn-epi-of
      handler: index.epicsOf
    - key: fn-iss-in-epi
      handler: index.issuesInEpics
    - key: fn-chi-iss-of
      handler: index.childIssuesOf
    - key: fn-lin-iss-of
      handler: index.linkedIssuesOf
    - key: fn-lin-iss-of-rec
      handler: index.linkedIssuesOfRecursive
    - key: fn-lin-iss-of-rec-lim
      handler: index.linkedIssuesOfRecursiveLimited
    - key: fn-has-lin
      handler: index.hasLinks
    - key: fn-has-lin-typ
      handler: index.hasLinkType
    - key: fn-has-sub
      handler: index.hasSubtasks
    - key: fn-pre-spr
      handler: index.previousSprint
    - key: fn-nex-spr
      handler: index.nextSprint
    - key: fn-add-aft-spr-sta
      handler: index.addedAfterSprintStart
    - key: fn-rem-aft-spr-sta
      handler: index.removedAfterSprintStart
    - key: fn-inc-in-spr
      handler: index.incompleteInSprint
    - key: fn-com-in-spr
      handler: index.completeInSprint
    - key: fn-com
      handler: index.commented
    - key: fn-las-com
      handler: index.lastComment
    - key: fn-has-com
      handler: index.hasComments
    - key: fn-fil-att
      handler: index.fileAttached
    - key: fn-has-att
      handler: index.hasAttachments
    - key: fn-dat-com
      handler: index.dateCompare
    - key: fn-exp
      handler: index.expression
    - key: on-event
      handler: index.onEvent
    - key: on-refresh
      handler: index.onRefresh
      timeoutSeconds: 300
    - key: on-reconcile
      handler: index.onReconcile
      timeoutSeconds: 900
    - key: on-backfill
      handler: index.onBackfill
      timeoutSeconds: 300
    - key: on-lifecycle
      handler: index.onLifecycle
resources:
  - key: global-page
    path: static/app/dist/global-page
  - key: admin-page
    path: static/app/dist/admin-page
  - key: icons
    path: resources
translations:
  resources:
    - key: zh-CN
      path: locales/zh-CN.json
    - key: zh-TW
      path: locales/zh-TW.json
    - key: cs-CZ
      path: locales/cs-CZ.json
    - key: da-DK
      path: locales/da-DK.json
    - key: nl-NL
      path: locales/nl-NL.json
    - key: en-US
      path: locales/en-US.json
    - key: en-GB
      path: locales/en-GB.json
    - key: et-EE
      path: locales/et-EE.json
    - key: fi-FI
      path: locales/fi-FI.json
    - key: fr-FR
      path: locales/fr-FR.json
    - key: de-DE
      path: locales/de-DE.json
    - key: hu-HU
      path: locales/hu-HU.json
    - key: is-IS
      path: locales/is-IS.json
    - key: it-IT
      path: locales/it-IT.json
    - key: ja-JP
      path: locales/ja-JP.json
    - key: ko-KR
      path: locales/ko-KR.json
    - key: no-NO
      path: locales/no-NO.json
    - key: pl-PL
      path: locales/pl-PL.json
    - key: pt-BR
      path: locales/pt-BR.json
    - key: pt-PT
      path: locales/pt-PT.json
    - key: ro-RO
      path: locales/ro-RO.json
    - key: ru-RU
      path: locales/ru-RU.json
    - key: sk-SK
      path: locales/sk-SK.json
    - key: tr-TR
      path: locales/tr-TR.json
    - key: es-ES
      path: locales/es-ES.json
    - key: sv-SE
      path: locales/sv-SE.json
  fallback:
    default: en-US
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:board-scope:jira-software
    - read:sprint:jira-software
    - read:project:jira
    - read:group:jira
    - read:user:jira
    - read:avatar:jira
    - read:app-data:jira
    - write:app-data:jira
    - storage:app
  content:
    styles:
      - 'unsafe-inline'
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/826ce7d1-f42b-471e-90a6-082bc3cad9a9
  licensing:
    enabled: true
