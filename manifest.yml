modules:
  jira:projectPage:
    - key: trace-project-page
      resource: project-page
      resolver:
        function: resolver
      render: native
      title: ArtUp Trace
  jira:issuePanel:
    - key: trace-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      render: native
      title: ArtUp Trace
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  trigger:
    - key: lifecycle
      function: on-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
    - key: issue-events
      function: on-issue-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
      filter:
        ignoreSelf: true
  consumer:
    - key: trace-jobs-consumer
      queue: trace-jobs
      function: job-worker
  scheduledTrigger:
    - key: hourly-reconcile
      function: reconcile
      interval: hour
  function:
    - key: on-lifecycle
      handler: index.onLifecycle
    - key: on-issue-event
      handler: index.onIssueEvent
    - key: job-worker
      handler: index.jobWorker
      timeoutSeconds: 900
    - key: reconcile
      handler: index.reconcile
      timeoutSeconds: 900
    - key: resolver
      handler: index.resolverHandler
  sql:
    - key: main
      engine: mysql
resources:
  - key: project-page
    path: src/frontend/projectPage.jsx
  - key: issue-panel
    path: src/frontend/issuePanel.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/6f24b898-5a6c-4b8b-92b2-d218cfeb1a6c
