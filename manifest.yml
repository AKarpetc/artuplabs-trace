modules:
  trigger:
    - key: lifecycle
      function: on-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  function:
    - key: on-lifecycle
      handler: index.onLifecycle
  sql:
    - key: main
      engine: mysql
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/6f24b898-5a6c-4b8b-92b2-d218cfeb1a6c
