name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/trace/package-lock.json
            apps/trace/static/app/package-lock.json
            apps/export/package-lock.json
            apps/export/static/app/package-lock.json
            apps/reports/package-lock.json

      - name: "Trace: install"
        working-directory: apps/trace
        run: |
          npm ci
          npm ci --prefix static/app
      - name: "Trace: lint"
        working-directory: apps/trace
        run: npm run lint
      - name: "Trace: test"
        working-directory: apps/trace
        run: npm test
      - name: "Trace: UI test"
        working-directory: apps/trace
        run: npm run test:ui
      - name: "Trace: UI build"
        working-directory: apps/trace
        run: npm run build:ui
      - name: "Trace: audit"
        working-directory: apps/trace
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix static/app

      - name: "Export: install"
        working-directory: apps/export
        run: |
          npm ci
          npm ci --prefix static/app
      - name: "Export: lint"
        working-directory: apps/export
        run: npm run lint
      - name: "Export: test"
        working-directory: apps/export
        run: npm test
      - name: "Export: UI test"
        working-directory: apps/export
        run: npm run test:ui
      - name: "Export: UI build"
        working-directory: apps/export
        run: npm run build:ui
      - name: "Export: audit"
        working-directory: apps/export
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix static/app

      - name: "Reports: install"
        working-directory: apps/reports
        run: npm ci
      - name: "Reports: lint"
        working-directory: apps/reports
        run: npm run lint
      - name: "Reports: test"
        working-directory: apps/reports
        run: npm test
      - name: "Reports: audit"
        working-directory: apps/reports
        run: npm audit --omit=dev --audit-level=high
