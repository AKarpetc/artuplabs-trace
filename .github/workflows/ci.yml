name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/app
      - run: npm run lint
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:ui
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix static/app
